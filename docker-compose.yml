services:
  brightedge:
    build: .
    container_name: brightedge-crawler
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
